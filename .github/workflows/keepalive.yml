name: Keepalive

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable-cron:
    runs-on: ubuntu-latest
    steps:
      - run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/cron.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
